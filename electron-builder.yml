appId: app.bestofbuilder
productName: BestofBuilder
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - node_modules/**
  # ffprobe-static contient les binaires de toutes les plateformes : on ne garde que Windows x64.
  - '!node_modules/ffprobe-static/bin/{darwin,linux}/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
# Les binaires ffmpeg/ffprobe doivent Ãªtre hors de l'archive asar pour Ãªtre exÃ©cutables.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
win:
  target:
    - nsis
    - portable
  # L'icône est lue automatiquement depuis build/icon.png (1024 px) si elle existe.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: BestofBuilder
portable:
  artifactName: ${productName}-${version}-portable.exe
# La publication GitHub Releases sera configurÃ©e au jalon M4.
